<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #eff6ff, #ffffff);
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
        }

        .auth-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dbeafe;
            border-radius: 50%;
            font-size: 30px;
        }

        .auth-card h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .register-btn {
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 8px;
        }

        .auth-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .auth-footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            &#128269; Lost<span>&</span>Found
        </div>

        <nav>
           
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#how-it-works">How It Works</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html">Login</a>
    <a href="register.html" class="nav-btn">Register</a>

        </nav>

    </header>


    <!-- Registration -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">&#128100;</div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Register for the College Lost & Found System
            </p>


            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="btn primary-btn register-btn"
                >
                    Create Account
                </button>

                <p id="registerMessage" class="auth-message"></p>

            </form>


            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
