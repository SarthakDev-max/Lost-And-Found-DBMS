<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #f4f7fb;
            margin: 0;
        }

        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-header h1 {
            margin-bottom: 10px;
            font-size: 38px;
            color: #0f172a;
        }

        .admin-header p {
            color: #64748b;
            font-size: 17px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-card h3 {
            margin: 5px 0;
            font-size: 30px;
            color: #0f172a;
        }

        .stat-card p {
            margin: 0;
            color: #64748b;
            font-weight: 600;
        }

        .claims-summary {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .claims-summary h2 {
            margin-top: 0;
            color: #0f172a;
        }

        .claim-status-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .status-box {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .pending-box {
            background: #fef3c7;
            color: #92400e;
        }

        .approved-box {
            background: #dcfce7;
            color: #166534;
        }

        .rejected-box {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-box h3 {
            font-size: 28px;
            margin: 5px 0;
        }

        .status-box p {
            margin: 0;
            font-weight: 700;
        }

        .admin-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .admin-action-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }

        .admin-action-card h3 {
            margin-top: 0;
            color: #0f172a;
        }

        .admin-action-card p {
            color: #64748b;
            line-height: 1.6;
        }

        .admin-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }

        .admin-btn:hover {
            background: #1d4ed8;
        }

        .loading,
        .error {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 16px;
            color: #64748b;
        }

        .error {
            color: #b91c1c;
        }

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .claim-status-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .admin-actions {
                grid-template-columns: 1fr;
            }

            .admin-header h1 {
                font-size: 30px;
            }

        }

    </style>

<style>
    .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 40px;
        gap: 20px;
    }

    .navbar a {
        display: inline-block;
        padding: 9px 16px;
        margin: 0 4px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        color: #374151;
        background: #f8fafc;
        border: 1px solid #dbe3ef;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .navbar a:hover {
        background: #eff6ff;
        color: #2563eb;
        border-color: #2563eb;
    }

    .navbar a.active {
        background: #2563eb;
        color: white;
        border-color: #2563eb;
    }

    .navbar #logoutBtn {
        color: #dc2626;
        background: #ffffff;
        border-color: #fecaca;
    }

    .navbar #logoutBtn:hover {
        background: #fef2f2;
        color: #b91c1c;
        border-color: #dc2626;
    }
</style>
<style>
</style>
</head>


<body>
<script>
    const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

    if (!loggedInUser || loggedInUser.Role !== "Admin") {
        alert("Access denied. Admin only.");
        window.location.href = "index.html";
    }
</script>

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                &#128269; Lost & Found
            </a>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="dashboard.html">Dashboard</a>

                <a href="admin-dashboard.html">
                    Admin Dashboard
                </a>

                <a href="admin-claims.html">
                    Claims
                </a>

                <a href="#" id="logoutBtn">
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <main class="admin-container">

        <div class="admin-header">

            <h1>Admin Dashboard</h1>

            <p>
                Overview of the Lost & Found Management System
            </p>

        </div>


        <div id="dashboardContent">

            <div class="loading">
                Loading dashboard statistics...
            </div>

        </div>

    </main>


    <script>

        async function loadAdminStats() {

            const dashboardContent =
                document.getElementById("dashboardContent");

            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin/stats"
                );

                const data = await response.json();

                if (!data.success) {

                    dashboardContent.innerHTML = `
                        <div class="error">
                            ${data.message || "Unable to load statistics."}
                        </div>
                    `;

                    return;
                }

                const stats = data.stats;


                dashboardContent.innerHTML = `

                    <div class="stats-grid">

                        <div class="stat-card">

                            <div class="stat-icon">
                                &#128100;
                            </div>

                            <h3>
                                ${stats.TotalUsers}
                            </h3>

                            <p>
                                Total Users
                            </p>

                        </div>


                        <div class="stat-card">

                            <div class="stat-icon">
                                &#128196;
                            </div>

                            <h3>
                                ${stats.TotalLostItems}
                            </h3>

                            <p>
                                Lost Items
                            </p>

                        </div>


                        <div class="stat-card">

                            <div class="stat-icon">
                                &#128230;
                            </div>

                            <h3>
                                ${stats.TotalFoundItems}
                            </h3>

                            <p>
                                Found Items
                            </p>

                        </div>


                        <div class="stat-card">

                            <div class="stat-icon">
                                &#128221;
                            </div>

                            <h3>
                                ${stats.TotalClaims}
                            </h3>

                            <p>
                                Total Claims
                            </p>

                        </div>

                    </div>


                    <div class="claims-summary">

                        <h2>
                            Claims Overview
                        </h2>

                        <div class="claim-status-grid">

                            <div class="status-box pending-box">

                                <p>
                                    Pending
                                </p>

                                <h3>
                                    ${stats.PendingClaims}
                                </h3>

                            </div>


                            <div class="status-box approved-box">

                                <p>
                                    Approved
                                </p>

                                <h3>
                                    ${stats.ApprovedClaims}
                                </h3>

                            </div>


                            <div class="status-box rejected-box">

                                <p>
                                    Rejected
                                </p>

                                <h3>
                                    ${stats.RejectedClaims}
                                </h3>

                            </div>

                        </div>

                    </div>


                    <div class="admin-actions">

                        <div class="admin-action-card">

                            <h3>
                                &#128221; Manage Claims
                            </h3>

                            <p>
                                Review user claims and approve or
                                reject pending claims.
                            </p>

                            <a
                                href="admin-claims.html"
                                class="admin-btn">
                                Manage Claims
                            </a>

                        </div>


                        <div class="admin-action-card">

                            <h3>
                                &#128202; System Overview
                            </h3>

                            <p>
                                View the current users, lost items,
                                found items and claim statistics.
                            </p>

                            <a
                                href="admin-dashboard.html"
                                class="admin-btn">
                                Refresh Dashboard
                            </a>

                        </div>

                    </div>

                `;

            } catch (error) {

                console.error(
                    "Admin dashboard error:",
                    error
                );

                dashboardContent.innerHTML = `
                    <div class="error">
                        Unable to connect to server.
                    </div>
                `;

            }

        }


        loadAdminStats();

    </script>


</body>

</html>
