<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Claims | Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">
<style>
    body {
        background: #f4f7fb;
        margin: 0;
    }

    .page-container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .page-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .page-header h1 {
        margin-bottom: 10px;
        font-size: 38px;
    }

    .page-header p {
        color: #64748b;
        font-size: 17px;
    }

    #claimsResults {
        max-width: 900px;
        margin: 0 auto;
    }

    .result-card {
        background: white;
        padding: 24px;
        margin-bottom: 20px;
        border-radius: 16px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        border: 1px solid #e5e7eb;
    }

    .result-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .result-title {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .result-title h3 {
        margin: 0;
        font-size: 22px;
        color: #0f172a;
    }

    .status-badge {
        padding: 7px 14px;
        border-radius: 20px;
        background: #fef3c7;
        color: #92400e;
        font-size: 13px;
        font-weight: 700;
    }

    .result-details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 20px;
        color: #334155;
    }

    .result-details div {
        background: #f8fafc;
        padding: 11px 14px;
        border-radius: 8px;
    }

    .result-description {
        margin-top: 18px;
        padding: 15px;
        border-top: 1px solid #e5e7eb;
        background: #f8fafc;
        border-radius: 8px;
        color: #334155;
    }

    .loading,
    .empty,
    .error {
        text-align: center;
        padding: 40px;
        background: white;
        border-radius: 16px;
        color: #64748b;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.06);
    }

    .error {
        color: #b91c1c;
    }

    @media (max-width: 700px) {
        .result-top {
            flex-direction: column;
            align-items: flex-start;
        }

        .result-details {
            grid-template-columns: 1fr;
        }

        .page-header h1 {
            font-size: 30px;
        }
    }
</style>
</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                &#128269; Lost & Found
            </a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
            </div>

        </div>

    </nav>


    <main class="page-container">

        <div class="page-header">

            <h1>My Claims</h1>

            <p>
                Track the claims you have submitted.
            </p>

        </div>


        <div id="claimsResults">

            <div class="loading">
                Loading your claims...
            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
