<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports | Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .reports-page {
            min-height: calc(100vh - 72px);
            background: #f8fafc;
            padding: 45px 20px;
        }

        .reports-container {
            max-width: 1100px;
            margin: auto;
        }

        .reports-header {
            margin-bottom: 30px;
        }

        .reports-header h1 {
            color: #111827;
            margin-bottom: 8px;
        }

        .reports-header p {
            color: #64748b;
        }

        .back-dashboard {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .reports-list {
            display: grid;
            gap: 20px;
        }

        .report-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
        }

        .report-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .report-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-title h3 {
            margin: 0;
            color: #111827;
        }

        .report-type {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .lost-type {
            background: #fee2e2;
            color: #b91c1c;
        }

        .found-type {
            background: #dcfce7;
            color: #15803d;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .report-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 25px;
            color: #475569;
            font-size: 14px;
        }

        .report-details strong {
            color: #1f2937;
        }

        .report-description {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            color: #64748b;
            line-height: 1.6;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            color: #64748b;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 650px) {
            .report-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .report-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            &#128269; Lost<span>&</span>Found
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="nav-btn">Register</a>
        </nav>

    </header>


    <main class="reports-page">

        <div class="reports-container">

            <a href="dashboard.html" class="back-dashboard">
                &#8592; Back to Dashboard
            </a>

            <div class="reports-header">

                <h1>My Reports</h1>

                <p>
                    View all the lost and found items you have reported.
                </p>

            </div>


            <div id="reportsList" class="reports-list">

                <div class="loading">
                    Loading your reports...
                </div>

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
